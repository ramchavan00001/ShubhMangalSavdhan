# Non-secret environment for the Cloud Run API (secrets are attached by cloudbuild.api.yaml).
# In production the API refuses to start with console OTPs, mock payments or mock KYC.
NODE_ENV: production
WEB_URL: https://sms-web--shubh-mangal-savdhan.asia-southeast1.hosted.app   # change to your own domain later
ADMIN_PHONES: "919999999999"   # your number(s), 91XXXXXXXXXX, comma-separated

OTP_PROVIDER: msg91
MSG91_OTP_TEMPLATE_ID: ""
PAYMENTS_MODE: razorpay
RAZORPAY_KEY_ID: ""
KYC_PROVIDER: manual

BUSINESS_NAME: Shubh Mangal Savdhan
BUSINESS_GSTIN: "[YOUR GSTIN]"
BUSINESS_ADDRESS: "[YOUR REGISTERED ADDRESS]"
BUSINESS_STATE: Maharashtra
BUSINESS_SAC: "[SAC CODE]"

WHATSAPP_PROVIDER: console
WHATSAPP_PHONE_NUMBER_ID: ""
EMAIL_PROVIDER: console
SMTP_HOST: ""
SMTP_PORT: "587"
SMTP_USER: ""
EMAIL_FROM: Shubh Mangal Savdhan <no-reply@yourdomain.in>
AI_MODEL: claude-opus-5-5

# Photos and selfies in the private Firebase Storage bucket.
STORAGE_DRIVER: gcs
STORAGE_BUCKET: shubh-mangal-savdhan.firebasestorage.app
STORAGE_PREFIX: uploads/

# Daily jobs come from Cloud Scheduler (deploy/04-scheduler.sh), not from inside the API.
SCHEDULER_MODE: external
CRON_AUDIENCE: https://sms-api-268568048663.asia-south1.run.app
CRON_INVOKER_EMAIL: sms-scheduler@shubh-mangal-savdhan.iam.gserviceaccount.com
